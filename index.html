<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fallout 76 — Guia Interativo em Português</title>
<style>
:root{--bg:#0b0e13;--painel:#121822;--painel2:#182130;--linha:#243044;--texto:#e8edf5;--cinza:#9fb0c7;--verde:#00e5a0;--amarelo:#ffb020;--vermelho:#ff5d5d;--azul:#4da3ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,#16283a,#0b0e13 55%);color:var(--texto);font-family:Inter,Segoe UI,system-ui,sans-serif}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:#0d121b;border-right:1px solid var(--linha);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.marca{display:flex;gap:10px;align-items:center;font-weight:800;margin-bottom:18px}.cofre{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--verde),#0090ff);display:grid;place-items:center;color:#04121b;font-weight:900}
.menu{display:flex;flex-direction:column;gap:4px}.menu button{display:flex;gap:10px;align-items:center;background:transparent;border:1px solid transparent;color:var(--cinza);padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;text-align:left}
.menu button.ativo,.menu button:hover{background:var(--painel2);color:#fff;border-color:var(--linha)}
.conteudo{padding:26px;max-width:1150px;width:100%;margin:auto}
.tela{display:none}.tela.ativa{display:block;animation:aparecer .25s}@keyframes aparecer{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
h2{margin-top:0}.destaque{background:linear-gradient(135deg,rgba(0,229,160,.12),rgba(77,163,255,.1)),var(--painel);border:1px solid var(--linha);border-radius:22px;padding:28px;margin-bottom:20px}
.destaque h1{margin:0 0 8px;font-size:clamp(26px,3.4vw,40px)}.destaque p{color:var(--cinza);max-width:850px;margin:0}.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.grade{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.cartao{background:var(--painel);border:1px solid var(--linha);border-radius:16px;padding:18px;margin-bottom:16px}.cartao h3{margin:0 0 10px}.cartao p{color:var(--cinza);line-height:1.6;margin:0 0 10px}
.cartao ul{margin:0;padding-left:20px;color:var(--cinza);line-height:1.7}
.etiqueta{display:inline-block;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:#20303f;color:var(--cinza);margin:2px 4px 2px 0}
.etiqueta.verde{background:rgba(0,229,160,.15);color:var(--verde)}.etiqueta.amarela{background:rgba(255,176,32,.15);color:var(--amarelo)}.etiqueta.vermelha{background:rgba(255,93,93,.15);color:var(--vermelho)}
.busca{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--linha);background:var(--painel2);color:var(--texto);font-size:15px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;border-bottom:1px solid var(--linha);text-align:left;vertical-align:top}th{color:var(--cinza);font-size:12px;text-transform:uppercase}tr:hover td{background:#16202e}
.botao{background:var(--verde);border:0;color:#04121b;font-weight:800;padding:10px 16px;border-radius:10px;cursor:pointer}.botao.fantasma{background:transparent;color:var(--texto);border:1px solid var(--linha)}.botao.pequeno{padding:7px 11px;font-size:13px}
label.tarefa{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed #223047;cursor:pointer}label.tarefa input{accent-color:var(--verde);width:18px;height:18px;margin-top:2px}
.barra{height:10px;border-radius:99px;background:#1d2938;overflow:hidden;margin:10px 0}.barra span{display:block;height:100%;background:linear-gradient(90deg,var(--verde),var(--azul))}
.rota{border-left:3px solid var(--verde);padding:10px 14px;margin:10px 0;background:#141c28;border-radius:0 12px 12px 0}
.calculadora{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}.calculadora input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--linha);background:#0e1520;color:var(--texto)}
.resultado{font-size:22px;font-weight:800;color:var(--verde)}.aviso{background:rgba(255,176,32,.08);border:1px solid rgba(255,176,32,.25);padding:12px;border-radius:12px;color:#ffd88a;font-size:14px;margin-top:10px}
footer{border-top:1px solid var(--linha);padding:20px;color:var(--cinza);font-size:13px;text-align:center}.pequeno{font-size:11px;color:var(--cinza)}.oculto{display:none!important}
.mapa{position:relative;background:linear-gradient(160deg,#0d1420,#101a29);border:1px solid var(--linha);border-radius:18px;overflow:hidden}
#mapaJogo{width:100%;height:auto;display:block}.regiao{fill-opacity:.22;stroke-width:2;cursor:pointer;transition:.2s}.regiao:hover{fill-opacity:.38}
.marcador{cursor:pointer}.marcador circle{transition:.2s}.marcador:hover circle{r:9}
#infoMapa{position:absolute;left:12px;bottom:12px;max-width:340px;background:rgba(9,13,19,.95);border:1px solid var(--linha);border-radius:14px;padding:14px;display:none;z-index:5}
#infoMapa h4{margin:0 0 6px}#infoMapa p{margin:0;color:var(--cinza);font-size:13px;line-height:1.5}
.filtrosMapa{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filtrosMapa button{background:var(--painel2);border:1px solid var(--linha);color:var(--cinza);padding:8px 13px;border-radius:999px;font-weight:700;cursor:pointer}
.filtrosMapa button.ativo{color:#04121b;background:var(--verde);border-color:var(--verde)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--cinza);margin-top:10px}.bola{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--linha)}.menu{flex-direction:row;overflow-x:auto}}
</style>
</head>
<body>
<div class="layout">
<aside><div class="marca"><div class="cofre">76</div><div>FALLOUT 76<br><span class="pequeno">MANUAL COMPLETO</span></div></div><nav class="menu" id="menu"></nav></aside>
<div><main class="conteudo" id="conteudo"></main><footer>Guia não oficial • Totalmente em português • Edição pesquisada em 25 de outubro de 2026.</footer></div>
</div>
<script>
const secoes=[
{id:'inicio',titulo:'Início',icone:'🏠',html:`<div class="destaque"><h1>Manual completo de sobrevivência, progressão e endgame</h1><p>Guia para iniciantes, veteranos e jogadores retornando. Edição pesquisada em 25 de outubro de 2026.</p><div class="acoes"><button class="botao" onclick="irPara('mapa')">Abrir mapa interativo</button><button class="botao fantasma" onclick="irPara('coletas')">Ver coletas</button><button class="botao fantasma" onclick="irPara('rotina')">Rotina diária</button></div></div><div class="grade g3"><div class="cartao"><h3>🎯 Comece com objetivo</h3><p>Siga as missões iniciais, explore a Floresta e construa um C.A.M.P. funcional antes de se especializar.</p></div><div class="cartao"><h3>🧰 Administre recursos</h3><p>Marque componentes, recicle sucata, repare equipamentos e evite gastar recursos raros sem propósito.</p></div><div class="cartao"><h3>⚔️ Escolha uma arma principal</h3><p>Defina sua especialização antes de investir em S.P.E.C.I.A.L., vantagens e equipamentos lendários.</p></div></div><div class="cartao"><h3>🔎 Busca geral</h3><input id="buscaGeral" class="busca" placeholder="Ex.: adesivo, chumbo, mutação, Scrip, Expedição..."><div id="resultadosBusca"></div></div>`},
{id:'primeiros',titulo:'Primeiros passos',icone:'🚀',html:`<div class="cartao"><h3>O que fazer ao sair do Refúgio 76</h3><ul><li>Siga as missões iniciais.</li><li>Explore a Floresta antes de áreas perigosas.</li><li>Pegue sucata, medicamentos, munição e alimentos.</li><li>Construa C.A.M.P. com bancadas, estação química e cozinha.</li><li>Desmonte equipamentos desnecessários.</li><li>Marque componentes importantes.</li><li>Descubra estações de trem.</li><li>Entre em equipes públicas.</li></ul></div><div class="cartao"><h3>Prioridades iniciais</h3><ul><li>Missões principais.</li><li>Reparos e modificações.</li><li>Mochila e carga.</li><li>Escolher arma principal.</li><li>Guardar munição e cura.</li><li>Aprender V.A.T.S. e Pip-Boy.</li></ul><div class="aviso">Não tente montar uma build definitiva nos primeiros níveis.</div></div>`},
{id:'special',titulo:'S.P.E.C.I.A.L.',icone:'📊',html:`<div class="cartao"><h3>Atributos</h3><table><tr><th>Atributo</th><th>Função</th></tr><tr><td>Força</td><td>Carga, corpo a corpo e armas pesadas.</td></tr><tr><td>Percepção</td><td>Precisão e certos estilos de combate.</td></tr><tr><td>Resistência</td><td>Sobrevivência e defesa.</td></tr><tr><td>Carisma</td><td>Vantagens sociais e de equipe.</td></tr><tr><td>Inteligência</td><td>Fabricação, reparo e vantagens técnicas.</td></tr><tr><td>Agilidade</td><td>Furtividade, pontos de ação e mobilidade.</td></tr><tr><td>Sorte</td><td>Críticos, recuperação e outras mecânicas.</td></tr></table></div><div class="cartao"><h3>Como distribuir</h3><ul><li>Escolha a arma principal primeiro.</li><li>Use vantagens compatíveis.</li><li>Reserve espaço para defesa e cura.</li><li>Mantenha vantagens de fabricação.</li><li>Use espaços de configuração para builds diferentes.</li></ul></div>`},
{id:'vantagens',titulo:'Vantagens e builds',icone:'🃏',html:`<div class="grade g2"><div class="cartao"><h3>🔫 Comando</h3><p>Rifles automáticos. Bom dano sustentado; atenção à munição.</p></div><div class="cartao"><h3>🎯 Atirador</h3><p>Rifles não automáticos. Precisão, furtividade e economia de munição.</p></div><div class="cartao"><h3>💥 Artilheiro pesado</h3><p>Armas pesadas. Combina com Armadura Potente; atenção a peso e munição.</p></div><div class="cartao"><h3>🗡️ Corpo a corpo</h3><p>Economiza munição e usa Força; exige aproximação.</p></div><div class="cartao"><h3>🔫 Pistoleiro</h3><p>Pistolas. Funciona com V.A.T.S. ou combate direto.</p></div><div class="cartao"><h3>👁️ Furtividade</h3><p>Ataques furtivos e exploração cuidadosa.</p></div></div><div class="cartao"><h3>Como melhorar</h3><ul><li>Arma principal e reserva.</li><li>Vantagens compatíveis.</li><li>Sobrevivência adequada.</li><li>Armadura e efeitos lendários.</li><li>Testes em eventos reais.</li><li>Mude pouco por vez.</li></ul></div>`},
{id:'armas',titulo:'Armas e combate',icone:'⚔️',html:`<div class="cartao"><h3>Como escolher</h3><ul><li>Dano real.</li><li>Cadência.</li><li>Precisão e recuo.</li><li>Carregador.</li><li>Munição.</li><li>V.A.T.S.</li><li>Manutenção.</li><li>Vantagens.</li></ul></div><div class="grade g2"><div class="cartao"><h3>Automáticas</h3><p>Pressão constante; verifique munição.</p></div><div class="cartao"><h3>Rifles de precisão</h3><p>Exploração e furtividade.</p></div><div class="cartao"><h3>Pesadas</h3><p>Inimigos resistentes; peso e munição.</p></div><div class="cartao"><h3>Explosivas</h3><p>Atenção à distância e efeitos.</p></div></div><div class="cartao"><h3>V.A.T.S.</h3><ul><li>Observe a chance de acerto.</li><li>Ajuste a arma.</li><li>Use efeitos que melhorem o V.A.T.S.</li><li>Não dependa dele sempre.</li></ul></div>`},
{id:'armaduras',titulo:'Armaduras',icone:'🛡️',html:`<div class="grade g2"><div class="cartao"><h3>Convencional</h3><p>Furtividade, mobilidade ou resistência. Compare defesa, modificadores e efeitos.</p></div><div class="cartao"><h3>Armadura Potente</h3><p>Proteção e armas pesadas. Mantenha núcleos de fusão e repare as peças.</p></div></div><div class="cartao"><h3>Como escolher</h3><ul><li>Furtividade: efeitos de ocultação.</li><li>Pesadas: Armadura Potente.</li><li>Sobrevivência: defesa adequada.</li><li>Atividades: resistências específicas.</li></ul></div>`},
{id:'lendarios',titulo:'Lendários',icone:'✨',html:`<div class="cartao"><h3>Como conseguir</h3><ul><li>Inimigos lendários.</li><li>Eventos e missões.</li><li>Operações Diárias e Expedições.</li><li>Fabricação e modificação.</li></ul></div><div class="cartao"><h3>Itens que não servem</h3><ul><li>Compare com o equipamento atual.</li><li>Guarde peças úteis.</li><li>Troque por Scrip.</li><li>Não descarte itens raros sem avaliar.</li></ul></div><div class="cartao"><h3>Mudanças de 2026</h3><p>The Slasher permite alterar modificadores lendários de itens únicos e adicionar um quarto modificador: 50 Scrip para 1–3 estrelas e 100 Scrip para 4 estrelas. Itens únicos exigem Aço do Cofre para fabricação.</p></div>`},
{id:'mutacoes',titulo:'Mutações',icone:'☢️',html:`<div class="cartao"><h3>Como abordar</h3><ul><li>Escolha mutações úteis.</li><li>Verifique penalidades.</li><li>Use vantagens que reduzam efeitos negativos.</li><li>Não remova radiação se a build depender dela.</li><li>Mantenha RadAway.</li></ul></div><div class="cartao"><h3>Radiação</h3><p>Reduz a vida disponível. Use proteção em zonas contaminadas e leve cura.</p><div class="aviso">Builds de vida baixa usam radiação como estratégia; entenda os riscos antes de copiar.</div></div>`},
{id:'recursos',titulo:'Recursos',icone:'🧱',html:`<div class="cartao"><h3>Hábitos</h3><ul><li>Marque componentes.</li><li>Desmonte equipamentos.</li><li>Recolha sucata.</li><li>Guarde materiais raros.</li><li>Cozinhe alimentos.</li><li>Ferva água contaminada.</li><li>Repare antes de atividades difíceis.</li></ul></div><div class="cartao"><h3>Evitar desperdício</h3><ul><li>Defina o que fabricar.</li><li>Confira a receita.</li><li>Marque materiais.</li><li>Recolha durante rotas.</li><li>Fabrique só o necessário.</li></ul></div>`},
{id:'camp',titulo:'C.A.M.P.',icone:'🏕️',html:`<div class="cartao"><h3>Estrutura inicial</h3><ul><li>Bancada de armas.</li><li>Bancada de armaduras.</li><li>Estação química.</li><li>Cozinha.</li><li>Cama.</li><li>Armazenamento.</li><li>Iluminação.</li></ul></div><div class="cartao"><h3>Local</h3><ul><li>Perto de rotas.</li><li>Espaço para construir.</li><li>Recursos próximos.</li><li>Longe de inimigos perigosos.</li></ul></div><div class="cartao"><h3>Oficinas públicas</h3><p>Oferecem recursos, mas podem ser contestadas por outros jogadores e gerar PvP.</p></div>`},
{id:'economia',titulo:'Economia',icone:'💰',html:`<div class="grade g2"><div class="cartao"><h3>Tampas</h3><p>Compras e viagens rápidas pagas. Compare preços e venda o que não usa.</p></div><div class="cartao"><h3>Scrip lendário</h3><p>Equipamentos lendários. Respeite limites e priorize sua build.</p></div><div class="cartao"><h3>Barras de Ouro</h3><p>Recompensas e comerciantes específicos.</p></div><div class="cartao"><h3>Selos</h3><p>Recompensas de Expedições e atividades relacionadas.</p></div></div>`},
{id:'eventos',titulo:'Eventos',icone:'🎪',html:`<div class="cartao"><h3>Como participar</h3><ul><li>Abra o mapa.</li><li>Leia objetivos.</li><li>Verifique munição e cura.</li><li>Viaje quando pronto.</li><li>Contribua com os objetivos.</li></ul><p>Viagem rápida para eventos elegíveis é gratuita.</p></div><div class="cartao"><h3>Dicas</h3><ul><li>Chegue cedo.</li><li>Contribua mesmo sem liderar dano.</li><li>Proteja alvos em defesas.</li><li>Leve munição para chefes.</li></ul></div>`},
{id:'operacoes',titulo:'Operações',icone:'📡',html:`<div class="grade g2"><div class="cartao"><h3>Operações Diárias</h3><p>Uplink e Decryption. Leia condições, leve cura e munição, priorize o objetivo.</p></div><div class="cartao"><h3>Expedições</h3><p>Prepare equipamento, leia objetivos, gerencie munição e trabalhe em equipe.</p></div></div>`},
{id:'missoes',titulo:'Missões',icone:'🗺️',html:`<div class="grade g2"><div class="cartao"><h3>Missões principais</h3><p>Desbloqueiam sistemas e personagens. Não ignore missões que ensinam mecânicas.</p></div><div class="cartao"><h3>Exploração</h3><ul><li>Estações de trem.</li><li>Torres de observação.</li><li>Edifícios e contêineres.</li><li>Pontos de viagem rápida.</li></ul></div></div><div class="cartao"><h3>Planos</h3><p>Antes de comprar, verifique se já conhece, se usará e se o preço compensa.</p></div>`},
{id:'chefes',titulo:'Chefes',icone:'👹',html:`<div class="grade g2"><div class="cartao"><h3>Preparação</h3><ul><li>Repare a arma.</li><li>Munição suficiente.</li><li>Cura e consumíveis.</li><li>Resistência do equipamento.</li><li>Build adequada.</li></ul></div><div class="cartao"><h3>Durante a luta</h3><ul><li>Observe fases.</li><li>Evite áreas perigosas.</li><li>Reanime com segurança.</li><li>Contribua com objetivos.</li></ul></div></div>`},
{id:'solo',titulo:'Solo ou grupo',icone:'👥',html:`<div class="grade g2"><div class="cartao"><h3>Solo</h3><p>Liberdade e ritmo próprio. Leve arma reserva e recursos para reparos.</p></div><div class="cartao"><h3>Grupo</h3><p>Apoio em atividades difíceis. Escolha equipe pública compatível e ajude nos objetivos.</p></div></div>`},
{id:'rotina',titulo:'Rotina',icone:'📅',html:`<div class="grade g2"><div class="cartao"><h3>Diária</h3><label class="tarefa"><input type="checkbox" class="tarefa-item"><span>Conferir desafios</span></label><label class="tarefa"><input type="checkbox" class="tarefa-item"><span>Eventos públicos</span></label><label class="tarefa"><input type="checkbox" class="tarefa-item"><span>Operações Diárias</span></label><label class="tarefa"><input type="checkbox" class="tarefa-item"><span>Reparos</span></label><label class="tarefa"><input type="checkbox" class="tarefa-item"><span>Organizar inventário</span></label></div><div class="cartao"><h3>Semanal</h3><label class="tarefa"><input type="checkbox" class="tarefa-item"><span>Desafios semanais</span></label><label class="tarefa"><input type="checkbox" class="tarefa-item"><span>Temporada</span></label><label class="tarefa"><input type="checkbox" class="tarefa-item"><span>Planejar compras</span></label><label class="tarefa"><input type="checkbox" class="tarefa-item"><span>Atividades de maior recompensa</span></label></div></div>`},
{id:'erros',titulo:'Erros comuns',icone:'⚠️',html:`<div class="cartao"><h3>Evite</h3><ul><li>Carregar equipamento que não usa.</li><li>Guardar tudo sem avaliar.</li><li>Gastar moedas raras sem plano.</li><li>Fabricar munição sem custo.</li><li>Vantagens incompatíveis.</li><li>Ignorar reparos.</li><li>Entrar em eventos sem ler.</li><li>Comprar planos repetidos.</li><li>Descartar lendários sem avaliar.</li></ul></div>`},
{id:'prioridades',titulo:'Prioridades',icone:'📈',html:`<div class="grade g3"><div class="cartao"><h3>Início</h3><ul><li>Sistemas básicos.</li><li>Missões iniciais.</li><li>Base funcional.</li><li>Experimentar armas.</li></ul></div><div class="cartao"><h3>Intermediário</h3><ul><li>Arma principal.</li><li>S.P.E.C.I.A.L. e vantagens.</li><li>Armadura.</li><li>Lendários.</li></ul></div><div class="cartao"><h3>Endgame</h3><ul><li>Especializar build.</li><li>Otimizar lendários.</li><li>Atividades avançadas.</li><li>Moedas especiais.</li></ul></div></div>`},
{id:'fontes',titulo:'Fontes',icone:'🔗',html:`<div class="cartao"><h3>Oficiais</h3><ul><li><a href="https://fallout.bethesda.net/en/guide" target="_blank">Guia oficial</a></li><li><a href="https://fallout.bethesda.net/pt-BR/news/welcome-to-fallout-76-a-newcomers-guide" target="_blank">Guia em português</a></li><li><a href="https://bethesda.net/en-US/news/fallout-76-the-slasher-release-notes" target="_blank">The Slasher</a></li></ul></div><div class="cartao"><h3>Comunidade</h3><ul><li><a href="https://www.falloutbuilds.com/fo76/builds" target="_blank">FalloutBuilds</a></li><li><a href="https://fallout-76.wiki/pt-br/guides/" target="_blank">Wiki em português</a></li></ul></div>`},
{id:'coletas',titulo:'Coletas',icone:'⛏️',html:`<input id="buscaColetas" class="busca" placeholder="Filtrar coletas..."><div class="grade g2"><div class="cartao coleta" data-chaves="adesivo milho mutfruit tato água"><h3>🧪 Adesivo — C.A.M.P.</h3><p>2 milho + 2 mutfruit + 2 tato + 1 água purificada = Amido Vegetal; recicle para 5 adesivos.</p></div><div class="cartao coleta" data-chaves="adesivo plantas carnívoras goo"><h3>🌱 Adesivo rápido</h3><p>Goo Digerido de Plantas Carnívoras Gigantes no Charco de Cranberry.</p></div><div class="cartao coleta" data-chaves="chumbo lucky hole mine munição"><h3>🔩 Chumbo</h3><p>Lucky Hole Mine: 2 Minério de Chumbo + 1 Ácido = 5 sucata de chumbo.</p></div><div class="cartao coleta" data-chaves="parafuso sugar groove whitespring"><h3>🔧 Parafusos</h3><p>Ventiladores, globos, algemas, máquinas de escrever. Rota: Horizon's Rest → Whitespring → Abandoned Bog Town.</p></div><div class="cartao coleta" data-chaves="água purificada caps"><h3>💧 Água purificada</h3><p>Purificadores no C.A.M.P. para uso ou venda.</p></div><div class="cartao coleta" data-chaves="caps eventos vendedores"><h3>💰 Caps</h3><p>Vendedores, eventos e venda de sucata em pacotes, mods e planos.</p></div></div>`},
{id:'materiais',titulo:'Materiais',icone:'🧱',html:`<input id="buscaMateriais" class="busca" placeholder="Buscar material..."><div class="cartao"><table><tr><th>Material</th><th>Fontes</th><th>Uso</th></tr><tr class="material" data-chaves="adesivo"><td>Adesivo</td><td>Fita, cola, Amido Vegetal</td><td>Mods e reparos</td></tr><tr class="material" data-chaves="alumínio"><td>Alumínio</td><td>Latas, despertadores</td><td>Armaduras e armas</td></tr><tr class="material" data-chaves="chumbo"><td>Chumbo</td><td>Tintas, latas, minério</td><td>Munição</td></tr><tr class="material" data-chaves="parafuso"><td>Parafuso</td><td>Ventiladores, globos</td><td>Mods</td></tr><tr class="material" data-chaves="aço"><td>Aço</td><td>Armas e sucata</td><td>Construção</td></tr><tr class="material" data-chaves="ácido"><td>Ácido</td><td>Baterias, extratores</td><td>Fundição</td></tr><tr class="material" data-chaves="cobre"><td>Cobre</td><td>Fios, lâmpadas</td><td>Geradores</td></tr><tr class="material" data-chaves="plástico"><td>Plástico</td><td>Garrafas</td><td>Pacotes</td></tr><tr class="material" data-chaves="borracha"><td>Borracha</td><td>Pneus</td><td>Reparos</td></tr><tr class="material" data-chaves="madeira"><td>Madeira</td><td>Galhos, caixotes</td><td>Construção</td></tr><tr class="material" data-chaves="tecido"><td>Tecido</td><td>Roupas, lonas</td><td>Armaduras</td></tr><tr class="material" data-chaves="óleo"><td>Óleo</td><td>Recipientes</td><td>Crafting</td></tr></table></div><div class="cartao"><h3>🧮 Calculadora de adesivo</h3><div class="calculadora"><div><label class="pequeno">Milho</label><input id="milho" type="number" value="20"></div><div><label class="pequeno">Mutfruit</label><input id="mutfruit" type="number" value="20"></div><div><label class="pequeno">Tato</label><input id="tato" type="number" value="20"></div><div><label class="pequeno">Água</label><input id="agua" type="number" value="10"></div></div><div>Adesivo: <span class="resultado" id="saidaAdesivo">0</span></div></div>`},
{id:'oficinas',titulo:'Oficinas',icone:'🏗️',html:`<div class="grade g2"><div class="cartao"><h3>Tyler County Dirt Track</h3><p>A Floresta. Prata, alumínio e aço.</p></div><div class="cartao"><h3>Gorge Junkyard</h3><p>A Floresta. Sucata, madeira e titânio.</p></div><div class="cartao"><h3>Fábrica de Munição Convertida</h3><p>Divisão Selvagem. Alumínio, chumbo, óleo e prata.</p></div><div class="cartao"><h3>Cidade Abandonada do Charco</h3><p>Charco de Cranberry. Ácido, concreto, ouro e prata.</p></div><div class="cartao"><h3>Propriedade Dabney</h3><p>O Charco. Cobre, concreto e madeira.</p></div><div class="cartao"><h3>Aeroporto Wade</h3><p>A Floresta. Cobre e óleo.</p></div></div>`},
{id:'tarefas',titulo:'Tarefas',icone:'✅',html:`<div class="cartao"><div style="display:flex;justify-content:space-between"><h3>Progresso</h3><span id="textoProgresso">0%</span></div><div class="barra"><span id="barraProgresso" style="width:0%"></span></div><button class="botao fantasma pequeno" onclick="limparTarefas()">Limpar progresso</button></div>`}
];
const menu=document.getElementById('menu'),conteudo=document.getElementById('conteudo');
secoes.forEach(s=>{const b=document.createElement('button');b.innerHTML=`<span>${s.icone}</span> ${s.titulo}`;b.dataset.tela=s.id;b.onclick=()=>irPara(s.id);menu.appendChild(b);const sec=document.createElement('section');sec.id=s.id;sec.className='tela'+(s.id==='inicio'?' ativa':'');sec.innerHTML=`<h2>${s.icone} ${s.titulo}</h2>`+s.html;conteudo.appendChild(sec);});
function irPara(id){document.querySelectorAll('.tela').forEach(t=>t.classList.toggle('ativa',t.id===id));document.querySelectorAll('#menu button').forEach(b=>b.classList.toggle('ativo',b.dataset.tela===id));window.scrollTo({top:0,behavior:'smooth'});}
function filtrar(idCampo,seletor){const q=document.getElementById(idCampo).value.toLowerCase().trim();document.querySelectorAll(seletor).forEach(c=>{const t=(c.dataset.chaves||'')+' '+c.textContent.toLowerCase();c.classList.toggle('oculto',q&&!t.includes(q));});}
document.addEventListener('input',e=>{if(e.target.id==='buscaColetas')filtrar('buscaColetas','.coleta');if(e.target.id==='buscaMateriais')filtrar('buscaMateriais','.material');if(e.target.id==='buscaGeral'){const q=e.target.value.toLowerCase().trim();const caixa=document.getElementById('resultadosBusca');if(!q){caixa.innerHTML='';return;}const a=secoes.filter(s=>(s.titulo+' '+s.html).toLowerCase().includes(q)).slice(0,8);caixa.innerHTML=a.length?a.map(x=>`<div class="rota"><b>${x.icone} ${x.titulo}</b></div>`).join(''):'<p class="pequeno">Nenhum resultado.</p>';}if(['milho','mutfruit','tato','agua'].includes(e.target.id))calcular();});
function calcular(){const m=+document.getElementById('milho').value||0,mu=+document.getElementById('mutfruit').value||0,t=+document.getElementById('tato').value||0,a=+document.getElementById('agua').value||0;const l=Math.min(Math.floor(m/2),Math.floor(mu/2),Math.floor(t/2),a);document.getElementById('saidaAdesivo').textContent=l*5;}
calcular();
const PONTOS=[{x:175,y:540,tipo:'oficina',nome:'Tyler County Dirt Track',info:'A Floresta. Prata, alumínio e aço.'},{x:245,y:585,tipo:'oficina',nome:'Gorge Junkyard',info:'A Floresta. Sucata, madeira e titânio.'},{x:300,y:665,tipo:'oficina',nome:'Aeroporto Wade',info:'A Floresta. Cobre e óleo.'},{x:390,y:410,tipo:'cidade',nome:'Grafton',info:'Vale Tóxico. Cidade inicial.'},{x:430,y:375,tipo:'coleta',nome:'Fazenda Becker',info:'Vale Tóxico. Comida e recursos.'},{x:245,y:700,tipo:'cidade',nome:'Lewisburg',info:'Monte de Cinzas. Comércio.'},{x:470,y:590,tipo:'coleta',nome:'Lucky Hole Mine',info:'Divisão Selvagem. Chumbo.'},{x:560,y:470,tipo:'coleta',nome:'Sugar Grove',info:'Divisão Selvagem. Parafusos.'},{x:600,y:520,tipo:'oficina',nome:'Fábrica de Munição Convertida',info:'Divisão Selvagem. Alumínio, chumbo, óleo.'},{x:730,y:390,tipo:'coleta',nome:'Harper\'s Ferry',info:'O Charco. Área avançada.'},{x:790,y:300,tipo:'coleta',nome:'Sparse Sundew Grove',info:'O Charco. Adesivo.'},{x:700,y:630,tipo:'oficina',nome:'Cidade Abandonada do Charco',info:'Charco de Cranberry. Ácido e ouro.'},{x:830,y:610,tipo:'perigo',nome:'Watoga',info:'Charco de Cranberry. Fim de jogo.'},{x:560,y:660,tipo:'cidade',nome:'The Whitespring',info:'Charco de Cranberry. Hub principal.'}];
const CORES={oficina:'#00e5a0',coleta:'#4da3ff',cidade:'#ffb020',perigo:'#ff5d5d'};const grupo=document.getElementById('marcadores');
function desenhar(tipo='todos'){grupo.innerHTML='';PONTOS.filter(p=>tipo==='todos'||p.tipo===tipo).forEach(p=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','marcador');g.innerHTML=`<circle cx="${p.x}" cy="${p.y}" r="7" fill="${CORES[p.tipo]}" stroke="#04121b" stroke-width="2"/><text x="${p.x+11}" y="${p.y+4}" fill="#dbe7f5" font-size="11">${p.nome}</text>`;g.onclick=()=>info(p.nome,p.info);grupo.appendChild(g);});}
function info(t,x){document.getElementById('tituloMapa').textContent=t;document.getElementById('textoMapa').textContent=x;document.getElementById('infoMapa').style.display='block';}
document.querySelectorAll('.regiao').forEach(r=>r.onclick=()=>info(r.dataset.nome,r.dataset.info));
document.querySelectorAll('#filtrosMapa button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#filtrosMapa button').forEach(x=>x.classList.remove('ativo'));b.classList.add('ativo');desenhar(b.dataset.tipo);});
desenhar();
const chave='guia_fo76_tarefas';
function carregar(){const s=JSON.parse(localStorage.getItem(chave)||'{}');document.querySelectorAll('.tarefa-item').forEach((c,i)=>{c.checked=!!s[i];c.onchange=salvar;});atualizar();}
function salvar(){const s={};document.querySelectorAll('.tarefa-item').forEach((c,i)=>s[i]=c.checked);localStorage.setItem(chave,JSON.stringify(s));atualizar();}
function atualizar(){const t=[...document.querySelectorAll('.tarefa-item')],f=t.filter(c=>c.checked).length,p=t.length?Math.round(f/t.length*100):0;document.getElementById('barraProgresso').style.width=p+'%';document.getElementById('textoProgresso').textContent=p+'%';}
function limparTarefas(){localStorage.removeItem(chave);document.querySelectorAll('.tarefa-item').forEach(c=>c.checked=false);atualizar();}
carregar();
</script>
